<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#94a3b8;--border:#e2e8f0;--accent:#2563eb;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;--cyan:#0891b2;
  --tbl-head:#f6f8fa;--editor-focus:#e8f0fe;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:0.82rem;line-height:1.6;}
/* Layout */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
header{grid-column:1/-1;display:flex;align-items:center;padding:0.5rem 1.2rem;background:#fff;
  border-bottom:1px solid var(--border);gap:0.8rem;position:sticky;top:0;z-index:100;}
.logo{font-size:0.9rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
.logo-sub{font-size:0.6rem;color:var(--muted);font-weight:500;}
.nav-links{display:flex;gap:0.3rem;margin-left:auto;flex-wrap:wrap;}
.nav-links a{padding:0.3rem 0.6rem;border-radius:6px;font-size:0.65rem;color:var(--muted);
  text-decoration:none;font-weight:500;transition:all 0.15s;}
.nav-links a:hover{background:#f0f4ff;color:var(--accent);}
.nav-links a.active{background:#e8f0fe;color:var(--accent);font-weight:600;}
/* Sidebar */
.sidebar{overflow-y:auto;padding:0.5rem 0.4rem;background:#fff;border-right:1px solid var(--border);
  position:sticky;top:45px;height:calc(100vh - 45px);display:flex;flex-direction:column;}
.sb-group-header{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:#94a3b8;
  padding:0.5rem 0.5rem 0.25rem;display:flex;align-items:center;gap:0.4rem;border-bottom:1px solid #e2e8f0;margin-bottom:0.3rem;}
.sb-group-header:not(:first-child){margin-top:0.4rem;}
.sb-item{display:flex;align-items:center;gap:0.35rem;padding:0.3rem 0.5rem;border-radius:8px;
  font-size:0.7rem;color:#3c4043;cursor:pointer;transition:all 0.15s;border:1px solid transparent;
  margin-bottom:1px;text-decoration:none;border-left:3px solid transparent;}
.sb-item:hover{background:#f0f4ff;color:#1a73e8;}
.sb-item.active{background:#e8f0fe;color:#1a73e8;border-left-color:#1a73e8;font-weight:600;box-shadow:0 1px 3px rgba(26,115,232,0.1);}
/* Unit color codes */
.sb-item.u-keuangan{border-left-color:#dc2626;}.sb-item.u-keuangan.active,.sb-item.u-keuangan:hover{background:#fef2f2;color:#dc2626;}
.sb-item.u-perencanaan{border-left-color:#7c3aed;}.sb-item.u-perencanaan.active,.sb-item.u-perencanaan:hover{background:#f5f3ff;color:#7c3aed;}
.sb-item.u-akademik{border-left-color:#2563eb;}.sb-item.u-akademik.active,.sb-item.u-akademik:hover{background:#eff6ff;color:#2563eb;}
.sb-item.u-kepegawaian{border-left-color:#d97706;}.sb-item.u-kepegawaian.active,.sb-item.u-kepegawaian:hover{background:#fffbeb;color:#d97706;}
.sb-item.u-lp2m{border-left-color:#16a34a;}.sb-item.u-lp2m.active,.sb-item.u-lp2m:hover{background:#f0fdf4;color:#16a34a;}
.sb-item.u-umum{border-left-color:#0891b2;}.sb-item.u-umum.active,.sb-item.u-umum:hover{background:#ecfeff;color:#0891b2;}
.sb-item.u-lpm{border-left-color:#7c3aed;}.sb-item.u-lpm.active,.sb-item.u-lpm:hover{background:#f5f3ff;color:#7c3aed;}
.sb-item.u-ptipd{border-left-color:#0284c7;}.sb-item.u-ptipd.active,.sb-item.u-ptipd:hover{background:#f0f9ff;color:#0284c7;}
.sb-item.u-perpustakaan{border-left-color:#9333ea;}.sb-item.u-perpustakaan.active,.sb-item.u-perpustakaan:hover{background:#faf5ff;color:#9333ea;}
.sb-item.u-karier{border-left-color:#ea580c;}.sb-item.u-karier.active,.sb-item.u-karier:hover{background:#fff7ed;color:#ea580c;}
.sb-item.u-bahasa{border-left-color:#059669;}.sb-item.u-bahasa.active,.sb-item.u-bahasa:hover{background:#ecfdf5;color:#059669;}
.sb-item.u-mahad{border-left-color:#b45309;}.sb-item.u-mahad.active,.sb-item.u-mahad:hover{background:#fffbeb;color:#b45309;}
.sb-item.u-spi{border-left-color:#be123c;}.sb-item.u-spi.active,.sb-item.u-spi:hover{background:#fff1f2;color:#be123c;}
/* Main */
.main{overflow-y:auto;padding:1.5rem 2rem;height:calc(100vh - 45px);}
.unit-block{display:none;}
.unit-block.active{display:block;}
.unit-head{margin-bottom:1.2rem;padding:1rem 1.2rem;background:#fff;border-radius:12px;border:1px solid var(--border);}
.unit-icon{font-size:1.5rem;margin-bottom:0.3rem;}
.unit-name{font-size:1.1rem;font-weight:800;color:var(--text);}
.unit-desc{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}
.unit-badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:20px;font-size:0.58rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.5px;margin-top:0.4rem;}
/* Table cards */
.tbl-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;overflow:hidden;}
.tbl-card-head{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;border-bottom:1px solid var(--border);background:var(--tbl-head);}
.tbl-card-title{font-size:0.75rem;font-weight:700;color:var(--text);}
.tbl-card-ref{font-size:0.58rem;color:var(--muted);margin-left:auto;background:#f1f5f9;padding:0.15rem 0.4rem;border-radius:4px;}
.tbl-card-body{padding:0.5rem;}
/* Tables - Google Sheets style */
table.data-tbl{width:100%;border-collapse:collapse;font-size:0.72rem;}
table.data-tbl th{background:#f0f4ff;color:#1e293b;font-weight:600;padding:0.4rem 0.5rem;
  border:1px solid #d0d7de;text-align:left;white-space:normal;word-break:break-word;font-size:0.65rem;}
table.data-tbl td{border:1px solid #d0d7de;padding:0;}
table.data-tbl tr:nth-child(even) td{background:#fafbfc;}
table.data-tbl tr:hover td{background:#f0f4ff;}
table.data-tbl .section-row td{background:#eef2ff !important;font-weight:700;color:var(--accent);padding:0.4rem 0.5rem;}
.cell-input{width:100%;border:none;padding:0.35rem 0.5rem;font-size:0.72rem;font-family:'Inter',sans-serif;
  background:transparent;color:var(--text);outline:none;min-height:1.8rem;
  white-space:normal;word-break:break-word;}
.cell-input:focus{background:#fff;box-shadow:inset 0 0 0 2px #1a73e8;}
.cell-input.cell-label{font-weight:500;background:rgba(0,0,0,0.01);}
.cell-input.cell-readonly{background:#f6f8fa;color:#64748b;cursor:default;}
/* Row actions */
.row-del{width:28px;height:28px;border:none;background:transparent;color:#cbd5e1;cursor:pointer;
  font-size:0.7rem;border-radius:4px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.row-del:hover{background:#fef2f2;color:#dc2626;}
table.data-tbl th.col-act{width:30px;padding:0.2rem;text-align:center;}
table.data-tbl td.col-act{padding:0;text-align:center;border:1px solid #d0d7de;}
.add-row-btn{display:inline-flex;align-items:center;gap:0.3rem;padding:0.3rem 0.7rem;margin:0.4rem 0.3rem;
  border:1px dashed #94a3b8;border-radius:6px;background:transparent;color:#64748b;
  font-size:0.65rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s;}
.add-row-btn:hover{border-color:#2563eb;color:#2563eb;background:#f0f4ff;}
/* Status badges */
.status-empty{color:#dc2626;font-size:0.6rem;}.status-partial{color:#d97706;font-size:0.6rem;}.status-done{color:#16a34a;font-size:0.6rem;}
/* Actions */
.sb-actions{margin-top:auto;padding:0.5rem 0.3rem;border-top:1px solid var(--border);}
.sb-btn{display:flex;align-items:center;justify-content:center;gap:0.3rem;width:100%;padding:0.45rem;
  border-radius:8px;font-size:0.7rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  transition:all 0.15s;border:none;margin-bottom:0.3rem;}
.sb-btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;}
.sb-btn.primary:hover{box-shadow:0 3px 12px rgba(37,99,235,0.3);}
.sb-btn.export{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;}
.sb-btn.secondary{background:#f1f5f9;color:#475569;border:1px solid #d0d7de;}
.sb-btn.secondary:hover{background:#e2e8f0;}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#fff;border:1px solid var(--green);border-radius:10px;padding:0.5rem 1.2rem;
  font-size:0.78rem;color:var(--green);font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,0.15);
  opacity:0;pointer-events:none;transition:all 0.3s;z-index:400;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Progress */
.sb-progress-wrap{padding:0.5rem;margin-top:0.5rem;}
.sb-progress-label{font-size:0.6rem;font-weight:600;color:var(--muted);margin-bottom:0.3rem;}
.sb-progress-bar{height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;}
.sb-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#2563eb,#16a34a);transition:width 0.4s ease;width:0;}
.sb-progress-pct{font-size:0.6rem;font-weight:700;color:var(--accent);text-align:right;margin-top:0.2rem;}
/* Print */
@media print{header,.sidebar,.sb-actions,.toast,.modal-overlay{display:none!important;}.layout{grid-template-columns:1fr;}}
@media(max-width:800px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.5rem;
  width:90%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-title{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:1rem;
  display:flex;align-items:center;gap:0.5rem;}
.modal-field{margin-bottom:0.8rem;}
.modal-field label{display:block;font-size:0.7rem;font-weight:600;color:var(--muted);margin-bottom:0.3rem;}
.modal-field input,.modal-field select{width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);
  border-radius:8px;font-size:0.78rem;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);outline:none;}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
.modal-actions{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem;}
.modal-actions button{padding:0.5rem 1.2rem;border-radius:8px;font-size:0.75rem;font-weight:600;
  font-family:'Inter',sans-serif;cursor:pointer;border:none;transition:all 0.15s;}
.modal-actions .btn-cancel{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.modal-actions .btn-cancel:hover{background:var(--editor-focus);}
.modal-actions .btn-create{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;}
.modal-actions .btn-create:hover{box-shadow:0 3px 12px rgba(37,99,235,0.3);}
/* Add category button */
.add-category-btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;
  padding:1rem;margin-top:1rem;border:2px dashed var(--accent);border-radius:12px;
  background:linear-gradient(135deg,rgba(37,99,235,0.05),rgba(124,58,237,0.05));
  color:var(--accent);font-size:0.85rem;font-weight:700;font-family:'Inter',sans-serif;
  cursor:pointer;transition:all 0.25s;letter-spacing:0.3px;}
.add-category-btn:hover{border-style:solid;background:linear-gradient(135deg,rgba(37,99,235,0.12),rgba(124,58,237,0.12));

.add-category-btn i.plus-icon{font-size:0.7rem;background:var(--accent);color:#fff;width:24px;height:24px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;}
/* Delete table button */
.tbl-delete-btn{margin-left:0.4rem;background:none;border:none;color:#cbd5e1;cursor:pointer;
  font-size:0.65rem;padding:0.2rem 0.4rem;border-radius:4px;transition:all 0.15s;}
.tbl-delete-btn:hover{background:#fef2f2;color:#dc2626;}
/* Export dropdown per tabel */
.tbl-export-wrap{position:relative;margin-left:auto;display:flex;gap:0.25rem;}
.tbl-export-btn{display:inline-flex;align-items:center;gap:0.25rem;padding:0.2rem 0.5rem;
  border-radius:5px;font-size:0.6rem;font-weight:600;font-family:'Inter',sans-serif;
  cursor:pointer;border:none;transition:all 0.15s;white-space:nowrap;}
.tbl-export-btn.csv{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;}
.tbl-export-btn.csv:hover{background:#0369a1;color:#fff;}
.tbl-export-btn.xlsx{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;}
.tbl-export-btn.xlsx:hover{background:#15803d;color:#fff;}
/* Sidebar export split buttons */
.sb-btn-group{display:flex;gap:0.25rem;margin-bottom:0.3rem;}
.sb-btn-group .sb-btn{margin-bottom:0;flex:1;font-size:0.62rem;}
</style>
</head>

function renderTable(tbl){
  let h=`<table class="data-tbl" id="${tbl.id}"><thead><tr>`;
  tbl.headers.forEach((hd,i)=>{
    const isNoCol=i===0 && hd.toLowerCase()==='no';
    const w=isNoCol?'width:35px':i===0?'min-width:55px':i===1?'min-width:180px':i===2?'width:70px':'min-width:80px';
    h+=`<th style="${w}">${hd}</th>`;
  });
  h+=`<th class="col-act"></th></tr></thead><tbody>`;
  tbl.rows.forEach((row,ri)=>{
    const isSection=row[0]===''&&row.length<=3;
    if(isSection&&row[1]){
      h+=`<tr class="section-row"><td colspan="${tbl.headers.length+1}">${row[1]}</td></tr>`;
      return;
    }
    h+=`<tr>`;
    const isNoHeader=tbl.headers[0].toLowerCase()==='no';
    tbl.headers.forEach((hd,ci)=>{
      const val=row[ci]||'';
      if(ci===0 && isNoHeader){
        h+=`<td><input type="text" class="cell-input cell-label cell-readonly" value="${val.replace(/"/g,'&quot;')}" readonly oninput="markDirty()"/></td>`;
      } else if(ci<3){
        h+=`<td><input type="text" class="cell-input cell-label" value="${val.replace(/"/g,'&quot;')}" oninput="markDirty()"/></td>`;
      } else {
        h+=`<td><input type="text" class="cell-input" value="${val.replace(/"/g,'&quot;')}" oninput="markDirty()" placeholder="..."/></td>`;
      }
    });
    h+=`<td class="col-act"><button class="row-del" onclick="deleteRow(this)" title="Hapus baris"><i class="fa-solid fa-trash-can"></i></button></td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  return h;
}

function addRow(tblId, colCount){
  const tbl=document.getElementById(tblId);
  if(!tbl)return;
  const tbody=tbl.querySelector('tbody');
  const rows=tbody.querySelectorAll('tr:not(.section-row)');
  const nextNo=rows.length+1;
  const tr=document.createElement('tr');
  for(let i=0;i<colCount;i++){
    const td=document.createElement('td');
    const inp=document.createElement('input');
    inp.type='text';
    inp.className=i===0?'cell-input cell-label':'cell-input'+(i<3?' cell-label':'');
    inp.oninput=markDirty;
    if(i===0){inp.value=String(nextNo);inp.readOnly=true;inp.classList.add('cell-readonly');}
    if(i>=3)inp.placeholder='...';
    td.appendChild(inp);
    tr.appendChild(td);
  }
  // Delete button
  const actTd=document.createElement('td');
  actTd.className='col-act';
  actTd.innerHTML='<button class="row-del" onclick="deleteRow(this)" title="Hapus baris"><i class="fa-solid fa-trash-can"></i></button>';
  tr.appendChild(actTd);
  tbody.appendChild(tr);
  // Focus on indicator name (col 1)
  const nameInput=tr.querySelectorAll('.cell-input')[1];
  if(nameInput)nameInput.focus();
  markDirty();
}

function deleteRow(btn){
  const tr=btn.closest('tr');
  if(!tr)return;
  const tbody=tr.closest('tbody');
  const rows=tbody.querySelectorAll('tr:not(.section-row)');
  if(rows.length<=1){showToast('Minimal 1 baris harus ada');return;}
  tr.remove();
  // Re-number
  tbody.querySelectorAll('tr:not(.section-row)').forEach((r,i)=>{
    const noInput=r.querySelector('.cell-readonly');
    if(noInput)noInput.value=String(i+1);
  });
  markDirty();
}

function updateProgress(){
  let total=0,filled=0;
  UNITS.forEach(u=>{
    let uTotal=0,uFilled=0;
    u.tables.forEach(t=>{
      const tbl=document.getElementById(t.id);
      if(!tbl)return;
      tbl.querySelectorAll('tbody .cell-input:not(.cell-label):not(.cell-readonly)').forEach(inp=>{
        uTotal++;
        if(inp.value.trim()&&inp.value.trim()!=='...'&&inp.value.trim()!=='\u2014')uFilled++;
      });
    });
    total+=uTotal;filled+=uFilled;
    const pct=uTotal>0?Math.round(uFilled/uTotal*100):0;
    const st=document.getElementById('status-'+u.id);
    if(st){
      st.textContent=pct+'%';
      st.className=pct===0?'status-empty':pct<100?'status-partial':'status-done';
    }
  });
  // Also include custom tables
  Object.values(dcCustomTables).forEach(tables=>{
    tables.forEach(t=>{
      const tbl=document.getElementById(t.id);
      if(!tbl)return;
      tbl.querySelectorAll('tbody .cell-input:not(.cell-label):not(.cell-readonly)').forEach(inp=>{
        total++;if(inp.value.trim()&&inp.value.trim()!=='...'&&inp.value.trim()!=='\u2014')filled++;
      });
    });
  });
  const totalPct=total>0?Math.round(filled/total*100):0;
  const fill=document.getElementById('sb-progress-fill');
  const pctEl=document.getElementById('sb-progress-pct');
  if(fill)fill.style.width=totalPct+'%';
  if(pctEl)pctEl.textContent=totalPct+'%';
}

const API_URL='/api/data';

async function saveAll(silent=false){
  const data={units:{},timestamp:new Date().toISOString()};
  const exportData={timestamp:new Date().toISOString(), tables:{}};

  UNITS.forEach(u=>{
    data.units[u.id]={};
    u.tables.forEach(t=>{
      const tbl=document.getElementById(t.id);
      if(!tbl)return;
      const rows=[];
      const hdrs=[...tbl.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      tbl.querySelectorAll('tbody tr').forEach(tr=>{
        if(tr.classList.contains('section-row'))return;
        const cells=[];
        tr.querySelectorAll('.cell-input').forEach(inp=>cells.push(inp.value));
        rows.push(cells);
      });
      data.units[u.id][t.id]=rows;
      // Build export format
      const expRows=[];
      tbl.querySelectorAll('tbody tr:not(.section-row)').forEach(tr=>{
        const cells=[];
        tr.querySelectorAll('.cell-input').forEach(inp=>cells.push(inp.value.trim()));
        const dataVals=cells.slice(3);
        if(dataVals.some(v=>v&&v!=='...'&&v!=='\u2014'))
          expRows.push({cells:cells, headers:hdrs});
      });
      if(expRows.length>0) exportData.tables[t.id]={ref:t.ref, unit:u.name, rows:expRows};
    });
  });

  // Collect custom tables
  Object.entries(dcCustomTables).forEach(([key,tables])=>{
    const unitId=key.replace('custom_','');
    if(!data.units[unitId])data.units[unitId]={};
    tables.forEach(t=>{
      const tbl=document.getElementById(t.id);
      if(!tbl)return;
      const rows=[];
      const hdrs=[...tbl.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      tbl.querySelectorAll('tbody tr').forEach(tr=>{
        if(tr.classList.contains('section-row'))return;
        const cells=[];
        tr.querySelectorAll('.cell-input').forEach(inp=>cells.push(inp.value));
        rows.push(cells);
      });
      data.units[unitId][t.id]=rows;
      const expRows=[];
      tbl.querySelectorAll('tbody tr:not(.section-row)').forEach(tr=>{
        const cells=[];
        tr.querySelectorAll('.cell-input').forEach(inp=>cells.push(inp.value.trim()));
        const dataVals=cells.slice(3);
        if(dataVals.some(v=>v&&v!=='...'&&v!=='\u2014'))
          expRows.push({cells, headers:hdrs});
      });
      if(expRows.length>0) exportData.tables[t.id]={ref:t.ref, unit:key, rows:expRows};
    });
  });

  // Save to localStorage (fallback & local cache)
  localStorage.setItem(SK,JSON.stringify(data));
  localStorage.setItem('rsb_dc_export',JSON.stringify(exportData));

  // Save to centralized API (Cloudflare KV)
  let cloudSaved=false;
  try{
    // Save each unit separately to API
    const promises=UNITS.map(u=>{
      if(!data.units[u.id])return Promise.resolve();
      const unitExport={};
      u.tables.forEach(t=>{
        if(exportData.tables[t.id]) unitExport[t.id]=exportData.tables[t.id];
      });
      return fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          unitId:u.id,
          tables:unitExport,
          rawData:data.units[u.id],
          savedBy: 'unit-user',
          schemaVersion: SCHEMA_VERSION
        })
      });
    });
    await Promise.all(promises);
    cloudSaved=true;
  }catch(e){console.warn('Cloud save failed, data saved locally:',e);}

  dirty=false;
  if(!silent) showToast(cloudSaved
    ?'<i class="fa-solid fa-cloud-arrow-up"></i> Data tersimpan ke server!'
    :'<i class="fa-solid fa-circle-check"></i> Data tersimpan lokal (offline mode).');
}

async function loadData(){
  // Migration map: old unitId → new unitId for moved tables
  const UNIT_MIGRATION={'karier':'lpm'};
  // Build a table→unit lookup for all current tables
  const tblToUnit={};
  UNITS.forEach(u=>u.tables.forEach(t=>{tblToUnit[t.id]=u.id;}));

  function applyData(rawDataByUnit){
    Object.entries(rawDataByUnit).forEach(([unitId,unitData])=>{
      if(!unitData)return;
      const raw=unitData.rawData||unitData;
      Object.entries(raw).forEach(([tblId,rows])=>{
        if(!Array.isArray(rows))return;
        const tbl=document.getElementById(tblId);
        if(!tbl)return;
        const domRows=[...tbl.querySelectorAll('tbody tr:not(.section-row)')];
        // Apply KV data row-by-row
        rows.forEach((cells,ri)=>{
          if(!domRows[ri])return;
          const inputs=domRows[ri].querySelectorAll('.cell-input');
          cells.forEach((v,ci)=>{
            if(!inputs[ci])return;
            if(inputs[ci].classList.contains('cell-label'))return;
            const saved=(v||'').trim();
            const current=(inputs[ci].value||'').trim();
            const templateHasData=current && current!=='0' && current!=='...' && current!=='—' && /\d/.test(current) && current.length>1;
            const kvHasData=saved && saved!=='0' && saved!=='...' && saved!=='—' && /\d/.test(saved) && saved.length>1;
            if(templateHasData && !kvHasData) return;
            if(!saved || saved==='...' || saved==='—' || saved==='0'){
              if(!current || current==='...' || current==='—') inputs[ci].value=v;
              return;
            }
            inputs[ci].value=v;
          });
        });
        // Remove extra template rows that user had deleted
        // (KV has fewer rows = user previously deleted and saved)
        if(rows.length < domRows.length){
          for(let i=rows.length; i<domRows.length; i++){
            domRows[i].remove();
          }
          console.log('🗑️ '+tblId+': removed '+(domRows.length-rows.length)+' extra template rows');
        }
      });
    });
  }

  // Try loading from centralized API first
  let cloudData=null;
  try{
    const res=await fetch(API_URL);
    const json=await res.json();
    if(json.ok && json.data){
      cloudData=json.data;
      applyData(cloudData);
      const mergedExport={timestamp:new Date().toISOString(), tables:{}};
      Object.values(cloudData).forEach(record=>{
        if(record&&record.tables) Object.assign(mergedExport.tables,record.tables);
      });
      localStorage.setItem('rsb_dc_export',JSON.stringify(mergedExport));
      updateProgress();
      console.log('📥 Data loaded from cloud.');
      return;
    }
  }catch(e){console.warn('Cloud load failed, using local:',e);}

  // Fallback: load from localStorage
  try{
    const raw=localStorage.getItem(SK);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(!data.units)return;
    // Wrap in same structure as cloud data for applyData
    const wrapped={};
    Object.entries(data.units).forEach(([uid,tables])=>{
      wrapped[uid]={rawData:tables};
    });
    applyData(wrapped);
    updateProgress();
  }catch(e){console.error('Load error:',e);}
}

function resetAll(){
  localStorage.removeItem(SK);
  UNITS.forEach(u=>u.tables.forEach(t=>{
    const tbl=document.getElementById(t.id);
    if(!tbl)return;
    tbl.querySelectorAll('.cell-input:not(.cell-label):not(.cell-readonly)').forEach(inp=>inp.value='');
  }));
  updateProgress();
  showToast('Data di-reset!');
}

// --- Helper: baca data dari DOM tabel ---
function _readTableDOM(tblId){
  const tbl=document.getElementById(tblId);
  if(!tbl)return null;
  const headers=[...tbl.querySelectorAll('thead th')]
    .map(th=>th.textContent.trim()).filter((_,i)=>{
      // buang kolom action (th terakhir yang kosong)
      const allTh=tbl.querySelectorAll('thead th');
      return i<allTh.length-1;
    });
  const rows=[];
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    if(tr.classList.contains('section-row'))return;
    const cells=[];
    tr.querySelectorAll('.cell-input').forEach(inp=>cells.push(inp.value||''));
    rows.push(cells);
  });
  return {headers, rows};
}

// --- Helper: escape CSV cell ---
function _csvCell(v){
  const s=String(v??'');
  return (s.includes(',')||s.includes('"')||s.includes('\n'))
    ? '"'+s.replace(/"/g,'""')+'"' : s;
}

// --- Helper: download CSV blob ---
function _downloadCSV(content, filename){
  const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// --- Helper: buat worksheet XLSX dengan styling header ---
function _makeSheet(headers, rows, colorHex){
  const data=[headers,...rows];
  const ws=XLSX.utils.aoa_to_sheet(data);
  // Header row styling
  const headerColor=(colorHex||'#2563eb').replace('#','');
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(ws[addr]){
      ws[addr].s={
        font:{bold:true,color:{rgb:'FFFFFF'}},
        fill:{fgColor:{rgb:headerColor.toUpperCase()}},
        alignment:{horizontal:'center',wrapText:true}
      };
    }
  }
  // Auto column width
  ws['!cols']=headers.map((h,i)=>({
    wch:Math.max(h.length+2,...rows.map(r=>String(r[i]??'').length),8)
  }));
  return ws;
}

// --- Helper: download XLSX workbook ---
function _downloadXLSX(wb, filename){
  XLSX.writeFile(wb,filename);
}

// === EXPORT 1 TABEL (CSV) ===
function exportTableCSV(tblId, unitName, tblTitle){
  const d=_readTableDOM(tblId);
  if(!d){showToast('❌ Tabel tidak ditemukan');return;}
  let csv=[d.headers.map(_csvCell).join(',')];
  d.rows.forEach(row=>csv.push(row.map(_csvCell).join(',')));
  const safe=tblTitle.replace(/[^a-zA-Z0-9]/g,'_').substring(0,40);
  _downloadCSV(csv.join('\n'), safe+'_'+new Date().toISOString().slice(0,10)+'.csv');
  showToast('<i class="fa-solid fa-check"></i> CSV tabel berhasil diunduh!');
}

// === EXPORT 1 TABEL (Excel) ===
function exportTableExcel(tblId, unitName, tblTitle){
  const d=_readTableDOM(tblId);
  if(!d){showToast('❌ Tabel tidak ditemukan');return;}
  if(typeof XLSX==='undefined'){showToast('❌ Library Excel belum siap, coba lagi');return;}
  // Cari warna unit
  const u=UNITS.find(u=>u.tables.some(t=>t.id===tblId));
  const colorHex=u?u.colorHex:'#2563eb';
  const wb=XLSX.utils.book_new();
  // Sheet 1: data tabel
  const ws=_makeSheet(d.headers,d.rows,colorHex);
  const sheetName=(tblTitle.substring(0,28)||'Data').replace(/[\[\]\*\?:\/\\]/g,'_');
  XLSX.utils.book_append_sheet(wb,ws,sheetName);
  const safe=tblTitle.replace(/[^a-zA-Z0-9]/g,'_').substring(0,40);
  _downloadXLSX(wb, safe+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  showToast('<i class="fa-solid fa-check"></i> Excel tabel berhasil diunduh!');
}

// === EXPORT 1 UNIT — semua tabel → 1 CSV ===
function exportUnitCSV(unitId){
  const u=UNITS.find(x=>x.id===unitId);
  if(!u){showToast('❌ Unit tidak ditemukan');return;}
  let csv='';
  u.tables.forEach(t=>{
    const d=_readTableDOM(t.id);
    if(!d)return;
    // Judul tabel sebagai section header
    csv+='# '+t.title+'\n';
    csv+=d.headers.map(_csvCell).join(',')+'\n';
    d.rows.forEach(row=>csv+=row.map(_csvCell).join(',')+'\n');
    csv+='\n';
  });
  const safe=u.name.replace(/[^a-zA-Z0-9]/g,'_').substring(0,30);
  _downloadCSV(csv, 'unit_'+safe+'_'+new Date().toISOString().slice(0,10)+'.csv');
  showToast('<i class="fa-solid fa-check"></i> CSV unit '+u.name+' berhasil diunduh!');
}

// === EXPORT 1 UNIT — semua tabel → 1 Excel (tiap tabel = 1 sheet) ===
function exportUnitExcel(unitId){
  const u=UNITS.find(x=>x.id===unitId);
  if(!u){showToast('❌ Unit tidak ditemukan');return;}
  if(typeof XLSX==='undefined'){showToast('❌ Library Excel belum siap, coba lagi');return;}
  const wb=XLSX.utils.book_new();
  u.tables.forEach(t=>{
    const d=_readTableDOM(t.id);
    if(!d)return;
    const ws=_makeSheet(d.headers,d.rows,u.colorHex);
    const sheetName=t.title.substring(0,28).replace(/[\[\]\*\?:\/\\]/g,'_');
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });
  if(wb.SheetNames.length===0){showToast('Tidak ada tabel untuk diekspor');return;}
  const safe=u.name.replace(/[^a-zA-Z0-9]/g,'_').substring(0,30);
  _downloadXLSX(wb, 'unit_'+safe+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  showToast('<i class="fa-solid fa-check"></i> Excel unit '+u.name+' berhasil diunduh! ('+wb.SheetNames.length+' sheet)');
}

// === EXPORT SEMUA — semua unit & tabel → 1 Excel (tiap tabel = 1 sheet) ===
function exportAllExcel(){
  if(typeof XLSX==='undefined'){showToast('❌ Library Excel belum siap, coba lagi');return;}
  showToast('<i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan Excel...');
  const wb=XLSX.utils.book_new();
  let sheetCount=0;
  UNITS.forEach(u=>{
    u.tables.forEach(t=>{
      const d=_readTableDOM(t.id);
      if(!d)return;
      const ws=_makeSheet(d.headers,d.rows,u.colorHex);
      // Prefix nama sheet dengan kode unit (max 31 chars)
      const prefix=u.id.substring(0,6).toUpperCase();
      const tblShort=t.title.substring(0,22).replace(/[\[\]\*\?:\/\\]/g,'_');
      const sheetName=(prefix+'_'+tblShort).substring(0,31);
      XLSX.utils.book_append_sheet(wb,ws,sheetName);
      sheetCount++;
    });
  });
  if(sheetCount===0){showToast('Tidak ada data untuk diekspor');return;}
  _downloadXLSX(wb, 'data_rsb_semua_unit_'+new Date().toISOString().slice(0,10)+'.xlsx');
  showToast('<i class="fa-solid fa-check"></i> Excel semua unit berhasil diunduh! ('+sheetCount+' sheet)');
}

// === EXPORT SEMUA — semua unit & tabel → 1 CSV besar ===
async function exportCSVAll(){
  await saveAll(true);
  let csv='Unit,Tabel,Referensi';
  // Ambil max headers dari semua tabel
  let maxCols=0;
  UNITS.forEach(u=>u.tables.forEach(t=>{
    const d=_readTableDOM(t.id);
    if(d&&d.headers.length>maxCols)maxCols=d.headers.length;
  }));
  for(let i=0;i<maxCols;i++)csv+=',Kolom'+(i+1);
  csv+='\n';
  UNITS.forEach(u=>{
    u.tables.forEach(t=>{
      const d=_readTableDOM(t.id);
      if(!d)return;
      d.rows.forEach(row=>{
        const line=[_csvCell(u.name),_csvCell(t.title),_csvCell(t.ref),...row.map(_csvCell)];
        csv+=line.join(',')+'\n';
      });
    });
  });
  _downloadCSV(csv,'data_rsb_semua_unit_'+new Date().toISOString().slice(0,10)+'.csv');
  showToast('<i class="fa-solid fa-check"></i> CSV semua unit berhasil diunduh!');
}

async function exportCSV(){return exportCSVAll();}

async function backupKV(){
  showToast('🔄 Mengunduh backup KV...');
  try{
    const res=await fetch(API_URL);
    const json=await res.json();
    if(!json.ok||!json.data){showToast('❌ Gagal fetch data dari KV','error');return;}
    const backup={
      timestamp:new Date().toISOString(),
      source:'KV Cloudflare Workers',
      url:window.location.href,
      data:json.data
    };
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='kv_backup_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.json';
    a.click();
    URL.revokeObjectURL(url);
    // Summary
    let totalCells=0;
    Object.values(json.data).forEach(record=>{
      if(!record)return;
      const raw=record.rawData||record;
      Object.values(raw).forEach(tbl=>{
        if(Array.isArray(tbl)) tbl.forEach(row=>{
          if(Array.isArray(row)) row.forEach((c,ci)=>{
            if(ci>=3&&c&&c.trim()&&c.trim()!=='...'&&c.trim()!=='—') totalCells++;
          });
        });
      });
    });
    showToast('✅ Backup berhasil! ('+totalCells+' cells)','success');
  }catch(e){showToast('❌ Error: '+e.message,'error');}
}

============================================================ */
function openAddModal(unitId){
  document.getElementById('modal-unit').value=unitId;
  document.getElementById('modal-title').value='';
  document.getElementById('modal-ref').value='Custom';
  document.getElementById('modal-cols').value='2020,2021,2022,2023,2024,2025';
  document.getElementById('addModal').classList.add('show');
  setTimeout(()=>document.getElementById('modal-title').focus(),100);
}
function closeAddModal(){
  document.getElementById('addModal').classList.remove('show');
}

function createCustomTable(){
  const unitId=document.getElementById('modal-unit').value;
  const title=document.getElementById('modal-title').value.trim();
  const ref=document.getElementById('modal-ref').value.trim();
  const colsStr=document.getElementById('modal-cols').value.trim();
  if(!title){showToast('<i class="fa-solid fa-circle-exclamation" style="color:#dc2626"></i> Nama tabel harus diisi');return;}
  
  const cols=colsStr.split(',').map(c=>c.trim()).filter(c=>c);
  const customKey='custom_'+unitId;
  if(!dcCustomTables[customKey])dcCustomTables[customKey]=[];

  const newTbl={
    id:'dc-custom-'+Date.now(),
    title:title,
    ref:ref||'Custom',
    headers:['No','Indikator','Satuan',...cols],
    rows:[
      ['1','',''],
      ['2','',''],
      ['3','',''],
    ]
  };
  dcCustomTables[customKey].push(newTbl);
  saveDcCustom();
  closeAddModal();
  renderMain();
  navigateTo(unitId);
  showToast(`<i class="fa-solid fa-circle-check"></i> Tabel "${title}" ditambahkan`);
  markDirty();
}

function deleteCustomDcTable(customKey,idx){
  const tbl=dcCustomTables[customKey]?.[idx];
  if(!tbl)return;
  if(!confirm(`Hapus tabel "${tbl.title}"? Data di dalamnya akan hilang.`))return;
  dcCustomTables[customKey].splice(idx,1);
  saveDcCustom();
  const unitId=customKey.replace('custom_','');
  renderMain();
  navigateTo(unitId);
  showToast(`<i class="fa-solid fa-trash-can"></i> Tabel "${tbl.title}" dihapus`);
  markDirty();
}

// Role-based nav detection via Cloudflare Access
(async function detectRole(){
  let email='';
  try{
    const res=await fetch('/cdn-cgi/access/get-identity');
    if(res.ok){const id=await res.json();email=(id.email||'').toLowerCase();}
  }catch(e){}
  if(!email){
    try{const c=JSON.parse(localStorage.getItem('rsb_ai_config')||'{}');if(c.apiKey)email='wahid@uinponorogo.ac.id';}catch(e){}
  }
  const isAdmin=email==='wahid@uinponorogo.ac.id';
  const isStaff=!isAdmin && email.endsWith('@uinponorogo.ac.id');
  if(isAdmin){
    document.getElementById('adminNav').style.display='flex';
    document.getElementById('userLabel').innerHTML='<i class="fa-solid fa-shield-halved"></i> Admin: '+email;
  } else if(isStaff){
    document.getElementById('staffNav').style.display='flex';
    document.getElementById('userLabel').innerHTML='<i class="fa-solid fa-user"></i> '+email;
  }
})();
