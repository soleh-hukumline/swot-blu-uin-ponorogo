/* ===== THEME ===== */
:root{
  --bg:#0f172a;--surface:#1e293b;--card:rgba(30,41,59,0.95);
  --text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;
  --border:rgba(255,255,255,0.08);--green:#22c55e;--amber:#f59e0b;
  --red:#ef4444;--purple:#a78bfa;--cyan:#06b6d4;--teal:#14b8a6;
  --editor-bg:rgba(15,23,42,0.6);--editor-focus:rgba(59,130,246,0.12);
  --tbl-head:rgba(59,130,246,0.08);--tbl-alt:rgba(255,255,255,0.015);
  --tbl-border:rgba(255,255,255,0.06);
}
[data-theme="light"]{
  --bg:#f1f5f9;--surface:#fff;--card:rgba(255,255,255,0.97);
  --text:#0f172a;--muted:#64748b;--border:rgba(0,0,0,0.08);
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;
  --cyan:#0891b2;--teal:#0d9488;--accent:#2563eb;
  --editor-bg:rgba(241,245,249,0.8);--editor-focus:rgba(37,99,235,0.06);
  --tbl-head:rgba(37,99,235,0.06);--tbl-alt:rgba(0,0,0,0.015);
  --tbl-border:rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;}

/* ===== HEADER ===== */
header{display:flex;justify-content:space-between;align-items:center;padding:0.7rem 1.5rem;
  background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(12px);}
header h1{font-size:0.95rem;font-weight:700;white-space:nowrap;}
header h1 span{color:var(--accent);}
.nav-links{display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap;}
.nav-links a,.nav-links button{color:var(--muted);text-decoration:none;font-size:0.72rem;
  padding:0.25rem 0.55rem;border-radius:6px;border:1px solid var(--border);transition:all 0.2s;
  background:transparent;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-links a:hover,.nav-links a.active,.nav-links button:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 45px);}

/* ===== SIDEBAR ===== */
.sidebar{overflow-y:auto;padding:1rem 0.6rem;border-right:1px solid var(--border);background:var(--card);}
.sb-title{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:0 0.5rem;margin-bottom:0.6rem;}
.sb-item{display:flex;align-items:center;gap:0.4rem;padding:0.35rem 0.5rem;border-radius:6px;
  font-size:0.7rem;color:var(--muted);cursor:pointer;transition:all 0.15s;border:1px solid transparent;margin-bottom:1px;text-decoration:none;}
.sb-item:hover{background:var(--editor-focus);color:var(--text);}
.sb-item.active{background:rgba(59,130,246,0.12);color:var(--accent);border-color:rgba(59,130,246,0.2);font-weight:600;}
.sb-item.main{font-weight:700;color:var(--text);font-size:0.73rem;margin-top:0.6rem;}
.sb-item .sb-badge{margin-left:auto;font-size:0.55rem;padding:1px 5px;border-radius:4px;font-weight:700;
  background:rgba(148,163,184,0.1);color:var(--muted);}
.sb-badge.done{background:rgba(34,197,94,0.12);color:var(--green);}
.sb-badge.wip{background:rgba(245,158,11,0.12);color:var(--amber);}
.sb-sep{height:1px;background:var(--border);margin:0.5rem 0;}
.sb-actions{padding:0.5rem;display:flex;flex-direction:column;gap:0.3rem;margin-top:0.5rem;}
.sb-btn{padding:0.4rem 0.6rem;border-radius:7px;font-size:0.7rem;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.2s;border:none;display:flex;align-items:center;gap:0.3rem;justify-content:center;}
.sb-btn.primary{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;}
.sb-btn.primary:hover{box-shadow:0 3px 12px rgba(59,130,246,0.4);}
.sb-btn.secondary{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);}
.sb-btn.secondary:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ===== MAIN CONTENT ===== */
.main{overflow-y:auto;padding:1.5rem 2rem 4rem;}

/* Section blocks */
.sec-block{display:none;animation:fadeIn 0.3s ease;}
.sec-block.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.sec-head{margin-bottom:1.5rem;}
.sec-label{font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:0.3rem;}
.sec-h{font-family:'Merriweather',serif;font-size:1.3rem;font-weight:700;margin-bottom:0.3rem;}
.sec-desc{font-size:0.78rem;color:var(--muted);max-width:700px;line-height:1.6;}
.sec-limit{display:inline-block;font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:5px;
  background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);margin-top:0.4rem;}

/* Sub-component card */
.comp-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:1.2rem;overflow:hidden;}
.comp-header{display:flex;align-items:center;gap:0.6rem;padding:0.8rem 1rem;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.015);}
.comp-num{font-size:0.72rem;font-weight:800;color:var(--accent);min-width:18px;}
.comp-title{font-size:0.85rem;font-weight:700;flex:1;}
.comp-body{padding:1rem;}

/* ===== RICH TEXT EDITOR ===== */
.rte-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:0.8rem;}
.rte-toolbar{display:flex;gap:0.2rem;padding:0.4rem 0.6rem;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.rte-btn{width:28px;height:28px;border-radius:5px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;font-size:0.72rem;font-family:'Inter',sans-serif;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;}
.rte-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.rte-btn.active{background:rgba(59,130,246,0.15);color:var(--accent);}
.rte-sep{width:1px;height:20px;background:var(--border);margin:4px 3px;}
.rte-content{padding:1rem 1.2rem;min-height:180px;font-size:0.84rem;line-height:1.8;color:var(--text);
  outline:none;background:var(--editor-bg);transition:background 0.2s;}
.rte-content:focus{background:var(--editor-focus);}
.rte-content:empty::before{content:attr(data-placeholder);color:var(--muted);opacity:0.45;}
.rte-content h3{font-size:1rem;font-weight:700;margin:0.8rem 0 0.4rem;color:var(--text);}
.rte-content ul,.rte-content ol{padding-left:1.5rem;margin:0.3rem 0;}
.rte-footer{display:flex;justify-content:space-between;padding:0.3rem 0.8rem;background:rgba(255,255,255,0.015);
  border-top:1px solid var(--border);font-size:0.62rem;color:var(--muted);}

/* ===== EDITABLE TABLE ===== */
.tbl-wrap{overflow-x:auto;margin-bottom:0.8rem;border:1px solid var(--tbl-border);border-radius:10px;}
.tbl-actions{display:flex;gap:0.3rem;padding:0.4rem 0.6rem;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--tbl-border);}
.tbl-act{padding:0.2rem 0.5rem;border-radius:5px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;font-size:0.65rem;font-family:'Inter',sans-serif;transition:all 0.15s;}
.tbl-act:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
table.editable{width:100%;border-collapse:collapse;font-size:0.78rem;}
table.editable th{background:var(--tbl-head);color:var(--text);font-weight:700;font-size:0.7rem;
  text-transform:uppercase;letter-spacing:0.5px;padding:0.5rem 0.6rem;text-align:left;
  border-bottom:2px solid var(--tbl-border);white-space:nowrap;position:sticky;top:0;}
table.editable td{padding:0.4rem 0.6rem;border-bottom:1px solid var(--tbl-border);vertical-align:top;}
table.editable tr:nth-child(even){background:var(--tbl-alt);}
table.editable tr:hover{background:var(--editor-focus);}
table.editable td[contenteditable]{outline:none;min-width:60px;transition:background 0.15s;}
table.editable td[contenteditable]:focus{background:rgba(59,130,246,0.08);box-shadow:inset 0 0 0 1px var(--accent);}
table.editable td[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:0.3;font-style:italic;}
.row-del{width:20px;height:20px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-size:0.6rem;opacity:0;transition:opacity 0.15s;border-radius:4px;}
table.editable tr:hover .row-del{opacity:1;}
.row-del:hover{background:rgba(239,68,68,0.15);color:var(--red);}

/* ===== SWOT TABLE ===== */
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:0.8rem;}
.swot-quad{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.swot-quad-head{padding:0.5rem 0.8rem;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);}
.swot-quad-head.str{background:rgba(34,197,94,0.08);color:var(--green);}
.swot-quad-head.wk{background:rgba(239,68,68,0.08);color:var(--red);}
.swot-quad-head.opp{background:rgba(59,130,246,0.08);color:var(--accent);}
.swot-quad-head.thr{background:rgba(245,158,11,0.08);color:var(--amber);}
.swot-quad-body{padding:0.6rem;min-height:100px;}
.swot-item{display:flex;gap:0.4rem;margin-bottom:0.3rem;font-size:0.76rem;}
.swot-item-num{font-weight:700;color:var(--muted);min-width:22px;flex-shrink:0;}
.swot-item-text{flex:1;outline:none;line-height:1.5;}
.swot-item-text:focus{border-bottom:1px dashed var(--accent);}
.swot-item-text:empty::before{content:'Tulis item...';color:var(--muted);opacity:0.3;}
.swot-add{width:100%;padding:0.3rem;border:1px dashed var(--border);border-radius:6px;background:transparent;
  color:var(--muted);cursor:pointer;font-size:0.65rem;font-family:'Inter',sans-serif;transition:all 0.15s;margin-top:0.3rem;}
.swot-add:hover{border-color:var(--accent);color:var(--accent);}

/* ===== PREVIEW MODE ===== */
.preview-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.7);display:none;
  justify-content:center;align-items:flex-start;padding:2rem;overflow-y:auto;backdrop-filter:blur(4px);}
.preview-overlay.show{display:flex;}
.preview-paper{background:#fff;color:#1a1a1a;width:210mm;min-height:297mm;padding:25mm 20mm;
  font-family:'Merriweather','Times New Roman',serif;font-size:12pt;line-height:1.8;box-shadow:0 8px 40px rgba(0,0,0,0.4);position:relative;}
.preview-close{position:fixed;top:1rem;right:1rem;z-index:501;padding:0.5rem 1rem;border-radius:8px;
  background:var(--red);color:#fff;border:none;cursor:pointer;font-size:0.85rem;font-weight:700;font-family:'Inter',sans-serif;}
.preview-paper h1{font-size:16pt;text-align:center;margin-bottom:8pt;}
.preview-paper h2{font-size:14pt;margin:16pt 0 8pt;border-bottom:1px solid #ccc;padding-bottom:4pt;}
.preview-paper h3{font-size:12pt;margin:12pt 0 6pt;}
.preview-paper p{margin-bottom:8pt;text-align:justify;}
.preview-paper table{width:100%;border-collapse:collapse;margin:8pt 0;font-size:10pt;}
.preview-paper table th,.preview-paper table td{border:1px solid #999;padding:4pt 6pt;text-align:left;}
.preview-paper table th{background:#e8e8e8;font-weight:bold;}

/* ===== TOAST & FAB ===== */
.save-fab{position:fixed;bottom:20px;right:20px;z-index:300;background:linear-gradient(135deg,#22c55e,#14b8a6);
  color:#fff;border:none;border-radius:50px;padding:10px 20px;font-size:0.8rem;font-weight:700;
  font-family:'Inter',sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,0.4);
  transition:all 0.25s;display:flex;align-items:center;gap:0.4rem;opacity:0;pointer-events:none;transform:translateY(16px);}
.save-fab.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--green);border-radius:10px;padding:0.5rem 1.2rem;
  font-size:0.78rem;color:var(--green);font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,0.3);
  opacity:0;pointer-events:none;transition:all 0.3s;z-index:400;backdrop-filter:blur(10px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== PRINT ===== */
@media print{
  header,.sidebar,.save-fab,.toast,.rte-toolbar,.rte-footer,.tbl-actions,.row-del,
  .swot-add,.nav-links,.sb-actions,.preview-close{display:none!important;}
  .layout{grid-template-columns:1fr!important;}
  .sec-block{display:block!important;}
  body{background:#fff;color:#000;font-size:11pt;}
  .main{padding:0!important;overflow:visible!important;}
  .comp-card{break-inside:avoid;border:1px solid #ccc;box-shadow:none;}
  table.editable th{background:#eee!important;}
}
@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:1rem;}
  .swot-grid{grid-template-columns:1fr;}
}
</style>

        type:'rte',
        template:'<h3>1. Latar Belakang</h3><p>Dokumen Rencana Strategis Bisnis (RSB) ini disusun sebagai pedoman strategis pengelolaan <b>Badan Layanan Umum (BLU) UIN Kiai Ageng Muhammad Besari Ponorogo</b> periode 2025–2029. Penyusunan RSB mengacu pada <b>PMK Nomor 76 Tahun 2025</b> (Perubahan Kedua atas PMK Nomor 129/PMK.05/2020) tentang Pedoman Pengelolaan BLU.</p><h3>2. Visi dan Arah Strategis</h3><p>UIN Ponorogo memiliki visi <b>\"Menjadi Universitas Islam Negeri yang Unggul, Moderat, dan Berdaya Saing di Tingkat Nasional dan Internasional pada Tahun 2030\"</b>. Transformasi dari IAIN menjadi UIN (Mei 2025) membuka peluang pengembangan prodi lintas bidang dan penguatan posisi sebagai BLU.</p><h3>3. Kondisi Saat Ini</h3><ul><li><b>Akademik:</b> 28 prodi aktif, 11 terakreditasi Unggul (37,9%), akreditasi institusi Unggul.</li><li><b>SDM:</b> 329 dosen (81 S3/24,6%, 15 Guru Besar), rasio dosen:mahasiswa 1:44.</li><li><b>Mahasiswa:</b> 10.182 mahasiswa aktif dengan pertumbuhan 4,7%/tahun.</li><li><b>Keuangan:</b> 7 unit PNBP aktif, pertumbuhan pendapatan rata-rata 8,3%/tahun.</li><li><b>Infrastruktur:</b> Fasilitas modern dari dana SBSN, Ma\'had Al-Jami\'ah.</li></ul><h3>4. Target Utama 2025–2029</h3><ul><li>Prodi terakreditasi Unggul naik dari 37,9% → 48,2%.</li><li>Dosen S3 naik dari 29,67% → 40%, rasio dosen:mahasiswa 1:30.</li><li>Pertumbuhan PNBP minimal 15%/tahun dengan 12+ unit bisnis aktif.</li><li>Publikasi Scopus meningkat dari 183 → 500+ dokumen.</li><li>Nilai SAKIP naik dari 78 (BB) → 90 (A).</li></ul><h3>5. Strategi Kunci</h3><ol><li><b>Diversifikasi PNBP:</b> Pengembangan 10 unit bisnis baru (LSP, teaching factory, klinik, inkubator).</li><li><b>Akselerasi SDM:</b> Program beasiswa S3, percepatan jabatan fungsional, rekrutmen dosen baru.</li><li><b>Penguatan Riset:</b> Research grant, visiting professor, target Q1/Q2 Scopus.</li><li><b>Tata Kelola BLU:</b> Implementasi SPIP, SOP keuangan BLU, reformasi birokrasi.</li><li><b>Infrastruktur Digital:</b> ogi, dan seni berbasis nilai keislaman.</li><li>Pelaksanaan pengabdian kepada masyarakat yang bermanfaat bagi pembangunan.</li><li>Pelaksanaan pembinaan civitas akademika dan hubungan dengan lingkungan.</li><li>Pelaksanaan kegiatan layanan administrasi umum, keuangan, dan kepegawaian.</li></ol>',

        template:'<h3>1. Model Bisnis BLU</h3><p>Model bisnis BLU UIN Ponorogo dibangun dengan pendekatan <b>triple helix</b> yang mengintegrasikan peran akademik, pemerintah, dan industri. Komponen model bisnis meliputi:</p><ul><li><b>Value Proposition:</b> Pendidikan tinggi Islam berkualitas dengan integrasi keilmuan, moderasi beragama, dan keunggulan lokal di kawasan Madiun Raya.</li><li><b>Customer Segments:</b> Mahasiswa S1/S2/S3, masyarakat umum, instansi pemerintah, dunia usaha/industri.</li><li><b>Revenue Streams:</b> UKT, asrama, sewa fasilitas, jasa konsultasi, sertifikasi, unit produksi, kerjasama.</li><li><b>Key Resources:</b> SDM dosen berkualitas, infrastruktur modern, brand UIN, jaringan alumni.</li></ul><h3>2. Sumber Pendapatan PNBP</h3><p>Sumber pendapatan PNBP BLU dikelompokkan menjadi:</p><h3>A. PNBP Aktif (7 Unit Eksisting)</h3><ol><li><b>UKT/SPP Mahasiswa</b> — sumber utama PNBP dari 10.182 mahasiswa aktif.</li><li><b>Asrama Ma\'had Al-Jami\'ah</b> — biaya penginapan dan pembinaan.</li><li><b>Sewa Gedung & Aula</b> — penyewaan fasilitas untuk acara eksternal.</li><li><b>Perpustakaan & Jasa Informasi</b> — layanan digital dan keanggotaan.</li><li><b>Pusat Pengembangan Bahasa</b> — kursus dan sertifikasi bahasa.</li><li><b>Kerjasama Pelatihan</b> — diklat, workshop, seminar berbayar.</li><li><b>Jasa Konsultasi & Penelitian</b> — penelitian kolaboratif dengan pihak eksternal.</li></ol><h3>B. PNBP Potensial (10 Unit Pengembangan)</h3><ol><li>Lembaga Sertifikasi Profesi (LSP-P1) — sertifikasi kompetensi bidang syariah, pendidikan, IT.</li><li>Teaching Factory — produksi berbasis kampus.</li><li>Pusat Studi & Konsultasi — kajian hukum Islam, ekonomi syariah, mediasi.</li><li>Klinik Kesehatan Kampus — layanan kesehatan dasar.</li><li>Unit Produksi Halal — pengujian dan sertifikasi produk halal.</li><li>Inkubator Bisnis — pendampingan startup mahasiswa dan UMKM.</li><li>Digital Learning Hub — program online dan hybrid berbayar.</li><li>Pusat Pelatihan IT & AI — kursus komputasi, data science.</li><li>Wisata Edukasi & Religi — paket wisata kampus dan pesantren.</li><li>Co-Working Space & Event — penyewaan ruang kerja bersama.</li></ol><h3>3. Keunggulan Kompetitif</h3><p>Keunggulan kompetitif BLU UIN Ponorogo dibanding PTKIN lain:</p><ul><li><b>Monopoli geografis:</b> Satu-satunya UIN di kawasan Madiun Raya (Ponorogo, Madiun, Magetan, Ngawi, Pacitan).</li><li><b>Akreditasi Unggul:</b> Salah satu dari sedikit PTKIN di Jawa Timur dengan akreditasi institusi Unggul.</li><li><b>Infrastruktur modern:</b> Gedung dan fasilitas baru dari dana SBSN.</li><li><b>Integrasi keilmuan:</b> Status UIN memungkinkan pengembangan prodi lintas bidang.</li><li><b>Ma\'had Al-Jami\'ah:</b> Pembinaan karakter unik yang tidak dimiliki PTN umum.</li></ul>',
        placeholder:'Tuliskan strategi bisnis BLU: model bisnis, sumber PNBP, keunggulan kompetitif...'

        template:'<h3>Grand Strategy BLU UIN Ponorogo 2025–2029</h3><p>Berdasarkan hasil analisis SWOT dan posisi pada matriks IE, grand strategy BLU UIN Ponorogo ditetapkan sebagai <b>Strategi Pertumbuhan (Growth Strategy)</b> dengan penekanan pada:</p><ol><li><b>Penetrasi Pasar (Market Penetration):</b> Meningkatkan jumlah mahasiswa melalui peningkatan mutu layanan, promosi aktif, dan perluasan akses di wilayah Madiun Raya.</li><li><b>Pengembangan Produk (Product Development):</b> Membuka prodi baru bidang sains, teknologi, dan kesehatan sesuai status UIN; mengembangkan program sertifikasi dan pelatihan profesional.</li><li><b>Pengembangan Pasar (Market Development):</b> Memperluas jangkauan ke luar Madiun Raya, mahasiswa internasional, dan segmen profesional melalui program online/hybrid.</li><li><b>Diversifikasi (Diversification):</b> Mengembangkan 10+ unit bisnis PNBP baru (LSP, teaching factory, klinik, inkubator) untuk mengurangi ketergantungan pada UKT.</li></ol><h3>Strategi TOWS</h3><ul><li><b>SO Strategy:</b> Memanfaatkan status UIN dan akreditasi Unggul (S1,S2) untuk membuka prodi baru (O4) dan mengakses peluang PNBP baru (O5).</li><li><b>WO Strategy:</b> Memanfaatkan regulasi BLU (O6) untuk mengatasi keterbatasan fleksibilitas keuangan (W1) dan meningkatkan publikasi melalui program insentif (W2+O1).</li><li><b>ST Strategy:</b> Menggunakan monopoli geografis (S4) dan infrastruktur modern (S5) untuk menghadapi persaingan PTKIN BLU (T2) dan urbanisasi (T5).</li><li><b>WT Strategy:</b> Memperbaiki rasio dosen (W3) dan jabatan fungsional (W4) untuk menghadapi tuntutan efisiensi (T1) dan kompetisi (T2).</li></ul>',

function renderComponent(c){
  let h='';
  if(c.type.includes('swot')) h+=renderSwot(c);
  if(c.type.includes('rte')) h+=renderRTE(c);
  if(c.type.includes('table')&&c.table) h+=renderTable(c.table);
  return h;
}

function renderRTE(c){
  return `<div class="rte-wrap" id="rte-${c.id}">
    <div class="rte-toolbar">
      <button class="rte-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>

    <div class="rte-footer"><span id="wc-${c.id}">0 kata</span><span>Auto-save aktif</span></div>
  </div>`;
}

function renderTable(t){
  const hasSub=!!t.subheaders;
  let thRow1='',thRow2='';
  if(hasSub){
    // Complex header with subheaders (for Sebelum/Setelah BLU tables)
    let mainI=0;
    const spans=[];let ci=0;
    // Calculate colspan groups from subheaders
    t.headers.forEach((h,i)=>{
      if(h===''&&i>0){
        spans[spans.length-1].span++;
      }else{
        spans.push({text:h,span:1,idx:i});
      }
    });
    spans.forEach(s=>{
      thRow1+=`<th${s.span>1?' colspan="'+s.span+'"':''}>${s.text}</th>`;
    });
    thRow2=t.subheaders.filter(s=>s!=='').map(s=>`<th>${s}</th>`).join('');
  }else{
    thRow1=t.headers.map(h=>`<th>${h}</th>`).join('');
  }
  let rows=t.rows.map((r,ri)=>{
    const cells=r.map((c,ci)=>`<td contenteditable="true" data-ph="..." oninput="markDirty()">${c}</td>`).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="delRow(this)" title="Hapus baris">✕</button></td></tr>`;
  }).join('');

  return `<div class="tbl-wrap" id="tw-${t.id}">
    <div class="tbl-actions">
      <button class="tbl-act" onclick="addRow('${t.id}')">+ Tambah Baris</button>
      <button class="tbl-act" onclick="addCol('${t.id}')">+ Tambah Kolom</button>
    </div>
    <table class="editable" id="${t.id}">
      <thead><tr>${thRow1}<th></th></tr>${hasSub?'<tr>'+thRow2+'<th></th></tr>':''}</thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderSwot(c){
  const s=c.swot;
  const quads=[
    {key:'strengths',label:'Strengths (Kekuatan)',cls:'str',prefix:'S',items:s.strengths},
    {key:'weaknesses',label:'Weaknesses (Kelemahan)',cls:'wk',prefix:'W',items:s.weaknesses},
    {key:'opportunities',label:'Opportunities (Peluang)',cls:'opp',prefix:'O',items:s.opportunities},
    {key:'threats',label:'Threats (Ancaman)',cls:'thr',prefix:'T',items:s.threats},
  ];
  let h='<div class="swot-grid">';
  quads.forEach(q=>{
    let items=q.items.map((t,i)=>`<div class="swot-item"><span class="swot-item-num">${q.prefix}${i+1}</span><span class="swot-item-text" contenteditable="true" oninput="markDirty()">${t}</span></div>`).join('');
    h+=`<div class="swot-quad" id="swot-${q.key}"><div class="swot-quad-head ${q.cls}">${q.label}</div><div class="swot-quad-body">${items}<button class="swot-add" onclick="addSwotItem('${q.key}','${q.prefix}')">+ Tambah</button></div></div>`;
  });
  h+='</div>';
  return h;
}

function goTo(id){
  activeSection=id;
  document.querySelectorAll('.sec-block').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+id)?.classList.add('active');
  document.querySelectorAll('.sb-item.main').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.sb-item.main').forEach(el=>{
    if(el.textContent.includes(SECTIONS.find(s=>s.id===id)?.title?.substring(0,8)||''))el.classList.add('active');
  });
  document.querySelector('.main')?.scrollTo(0,0);
}

function fmt(cmd,val){
  if(cmd==='formatBlock')document.execCommand(cmd,false,'<'+(val||'p')+'>');
  else document.execCommand(cmd,false,null);
}

function loadTemplate(cid){
  const sec=SECTIONS.flatMap(s=>s.components).find(c=>c.id===cid);
  if(!sec||!sec.template)return;
  const ed=document.getElementById('ed-'+cid);
  if(!ed)return;
  if(ed.innerHTML.replace(/<br>|<p><\/p>/g,'').trim().length>0){
    if(!confirm('Konten saat ini akan diganti dengan template. Lanjutkan?'))return;
  }
  ed.innerHTML=sec.template;
  markDirty();updBadge(cid);
}

function addRow(tid){
  const tbl=document.getElementById(tid);if(!tbl)return;
  const cols=tbl.querySelector('thead tr').children.length;
  const tr=document.createElement('tr');
  for(let i=0;i<cols-1;i++){
    const td=document.createElement('td');td.contentEditable='true';td.dataset.ph='...';td.setAttribute('oninput','markDirty()');
    tr.appendChild(td);
  }
  const tdDel=document.createElement('td');
  tdDel.innerHTML='<button class="row-del" onclick="delRow(this)" title="Hapus">✕</button>';
  tr.appendChild(tdDel);
  tbl.querySelector('tbody').appendChild(tr);
  markDirty();
}
function delRow(btn){const tr=btn.closest('tr');tr.remove();markDirty();}
function addCol(tid){
  const tbl=document.getElementById(tid);if(!tbl)return;
  // Add header
  const ths=tbl.querySelectorAll('thead tr');
  ths.forEach(tr=>{
    const th=document.createElement('th');th.contentEditable='true';th.textContent='Kolom Baru';
    tr.insertBefore(th,tr.lastElementChild);
  });
  // Add cells
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    const td=document.createElement('td');td.contentEditable='true';td.dataset.ph='...';td.setAttribute('oninput','markDirty()');
    tr.insertBefore(td,tr.lastElementChild);
  });
  markDirty();
}

function addSwotItem(key,prefix){
  const quad=document.getElementById('swot-'+key);if(!quad)return;
  const body=quad.querySelector('.swot-quad-body');
  const items=body.querySelectorAll('.swot-item');
  const num=items.length+1;
  const div=document.createElement('div');div.className='swot-item';
  div.innerHTML=`<span class="swot-item-num">${prefix}${num}</span><span class="swot-item-text" contenteditable="true" oninput="markDirty()"></span>`;
  body.insertBefore(div,body.querySelector('.swot-add'));
  div.querySelector('.swot-item-text').focus();
  markDirty();
}

function updBadge(cid){
  const ed=document.getElementById('ed-'+cid);if(!ed)return;
  const text=ed.innerText||'';
  const words=text.trim().split(/\s+/).filter(w=>w.length>0).length;
  const wc=document.getElementById('wc-'+cid);
  if(wc)wc.textContent=words+' kata';
  const badge=document.getElementById('sbg-'+cid);
  if(badge){
    if(words>30){badge.textContent='✓';badge.className='sb-badge done';}
    else if(words>0){badge.textContent='...';badge.className='sb-badge wip';}
    else{badge.textContent='—';badge.className='sb-badge';}
  }
}

/* ============================================================
   SAVE / LOAD
============================================================ */
function markDirty(){
  dirty=true;
  document.getElementById('saveFab').classList.add('show');
}

function saveAll(){
  const data={sections:{},timestamp:new Date().toISOString()};
  SECTIONS.forEach(s=>{
    data.sections[s.id]={};
    s.components.forEach(c=>{
      const cd={};
      const ed=document.getElementById('ed-'+c.id);
      if(ed)cd.rte=ed.innerHTML;
      if(c.table){
        const tbl=document.getElementById(c.table.id);
        if(tbl){
          cd.tableHTML=tbl.querySelector('tbody').innerHTML;
          cd.theadHTML=tbl.querySelector('thead').innerHTML;
        }
      }
      if(c.type.includes('swot')){
        cd.swot={};
        ['strengths','weaknesses','opportunities','threats'].forEach(key=>{
          const quad=document.getElementById('swot-'+key);
          if(quad){
            cd.swot[key]=[...quad.querySelectorAll('.swot-item-text')].map(el=>el.innerHTML);
          }
        });
      }
      data.sections[s.id][c.id]=cd;
    });
  });
  try{
    localStorage.setItem(SK,JSON.stringify(data));
    dirty=false;
    document.getElementById('saveFab').classList.remove('show');
    showToast('✅ Dokumen tersimpan!');
  }catch(e){showToast('❌ Gagal: '+e.message);}
}

function loadData(){
  try{
    const raw=localStorage.getItem(SK);if(!raw)return;
    const data=JSON.parse(raw);if(!data.sections)return;
    SECTIONS.forEach(s=>{
      if(!data.sections[s.id])return;
      s.components.forEach(c=>{
        const cd=data.sections[s.id][c.id];if(!cd)return;
        const ed=document.getElementById('ed-'+c.id);
        if(ed&&cd.rte)ed.innerHTML=cd.rte;
        if(c.table&&cd.tableHTML){
          const tbl=document.getElementById(c.table.id);
          if(tbl){
            if(cd.theadHTML)tbl.querySelector('thead').innerHTML=cd.theadHTML;
            tbl.querySelector('tbody').innerHTML=cd.tableHTML;
          }
        }
        if(c.type.includes('swot')&&cd.swot){
          ['strengths','weaknesses','opportunities','threats'].forEach(key=>{
            const quad=document.getElementById('swot-'+key);
            if(!quad||!cd.swot[key])return;
            const body=quad.querySelector('.swot-quad-body');
            const addBtn=body.querySelector('.swot-add');
            body.querySelectorAll('.swot-item').forEach(el=>el.remove());
            const prefix=key==='strengths'?'S':key==='weaknesses'?'W':key==='opportunities'?'O':'T';
            cd.swot[key].forEach((text,i)=>{
              const div=document.createElement('div');div.className='swot-item';
              div.innerHTML=`<span class="swot-item-num">${prefix}${i+1}</span><span class="swot-item-text" contenteditable="true" oninput="markDirty()">${text}</span>`;
              body.insertBefore(div,addBtn);
            });
          });
        }
        updBadge(c.id);
      });
    });
  }catch(e){console.warn('Load error:',e);}
}

function resetAll(){if(!confirm('Reset semua konten?'))return;localStorage.removeItem(SK);location.reload();}

function syncFromLampiran(){
  function readTable(tblId){
    const tbl=document.getElementById(tblId);
    if(!tbl)return[];
    const rows=[];
    tbl.querySelectorAll('tbody tr').forEach(tr=>{
      const cells=[];
      tr.querySelectorAll('td').forEach(td=>cells.push(td.textContent.trim()));
      rows.push(cells);
    });
    return rows;
  }
  function calcTrend(v2020,v2024){
    const a=parseFloat(String(v2020).replace(/[^\d.,-]/g,'').replace(',','.'));
    const b=parseFloat(String(v2024).replace(/[^\d.,-]/g,'').replace(',','.'));
    if(isNaN(a)||isNaN(b)||a===0)return{tren:'\u2014',pct:'\u2014'};
    const pct=((b-a)/Math.abs(a)*100).toFixed(1);
    return{tren:b>a?'\u2191':b<a?'\u2193':'\u2192',pct:pct+'%'};
  }
  function makeHtmlTable(title,headers,rows){
    let h='<h3>'+title+'</h3><table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:0.85rem;">';
    h+='<thead><tr>'+headers.map(hd=>'<th style="border:1px solid var(--border);padding:6px 8px;background:rgba(59,130,246,0.1);font-weight:600;text-align:left;">'+hd+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{
      h+='<tr>'+r.map(c=>'<td style="border:1px solid var(--border);padding:4px 8px;">'+c+'</td>').join('')+'</tr>';
    });

  let synced=0;

    const sumRows=[];

/* ============================================================
   EXPORT DOCX — PMK 76/2025 Lampiran III Format
============================================================ */
async function exportDOCX(){
  showToast('⏳ Generating DOCX...');
  try{
    const{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
      WidthType,AlignmentType,HeadingLevel,ShadingType,TableLayoutType,PageBreak}=docx;

    function htmlToParas(html){
      const ps=[];if(!html||!html.trim())return ps;
      const d=document.createElement('div');d.innerHTML=html;
      function proc(n){
        if(n.nodeType===3){const t=n.textContent.trim();if(t)ps.push(new Paragraph({children:[new TextRun({text:t,size:24,font:'Times New Roman'})]}));return;}
        if(n.nodeType!==1)return;const tag=n.tagName.toLowerCase();
        if(tag==='h3'){ps.push(new Paragraph({children:[new TextRun({text:n.textContent,bold:true,size:24,font:'Times New Roman'})],spacing:{before:240,after:120}}));
        }else if(tag==='p'){
          const rs=[];
          n.childNodes.forEach(c=>{
            if(c.nodeType===3)rs.push(new TextRun({text:c.textContent,size:24,font:'Times New Roman'}));
            else if(c.tagName==='B'||c.tagName==='STRONG')rs.push(new TextRun({text:c.textContent,bold:true,size:24,font:'Times New Roman'}));
            else if(c.tagName==='I'||c.tagName==='EM')rs.push(new TextRun({text:c.textContent,italics:true,size:24,font:'Times New Roman'}));
            else rs.push(new TextRun({text:c.textContent,size:24,font:'Times New Roman'}));
          });
          if(rs.length)ps.push(new Paragraph({children:rs,spacing:{after:120},alignment:AlignmentType.JUSTIFIED}));
        }else if(tag==='ul'||tag==='ol'){
          n.querySelectorAll(':scope>li').forEach((li,i)=>{
            const px=tag==='ol'?`${i+1}. `:'\u2022 ';const rs=[new TextRun({text:px,size:24,font:'Times New Roman'})];
            li.childNodes.forEach(c=>{
              if(c.nodeType===3)rs.push(new TextRun({text:c.textContent,size:24,font:'Times New Roman'}));
              else if(c.tagName==='B'||c.tagName==='STRONG')rs.push(new TextRun({text:c.textContent,bold:true,size:24,font:'Times New Roman'}));
              else rs.push(new TextRun({text:c.textContent,size:24,font:'Times New Roman'}));
            });
            ps.push(new Paragraph({children:rs,indent:{left:720},spacing:{after:60}}));
          });
        }else{n.childNodes.forEach(c=>proc(c));}
      }
      d.childNodes.forEach(c=>proc(c));return ps;
    }

    function tblToDocx(el){
      if(!el)return null;const rows=el.querySelectorAll('tr');if(!rows.length)return null;
      const drs=[];
      rows.forEach((tr,ri)=>{
        const cells=tr.querySelectorAll('th,td');const dcs=[];
        cells.forEach(c=>{
          const isH=c.tagName==='TH'||ri===0;
          dcs.push(new TableCell({
            children:[new Paragraph({children:[new TextRun({text:c.textContent.trim(),bold:isH,size:20,font:'Times New Roman'})],spacing:{after:0}})],
            shading:isH?{type:ShadingType.CLEAR,fill:'D9E2F3'}:undefined
          }));
        });
        drs.push(new TableRow({children:dcs}));
      });
      return new Table({rows:drs,width:{size:100,type:WidthType.PERCENTAGE}});
    }

    const ch=[];
    ch.push(new Paragraph({spacing:{before:3000}}));
    ch.push(new Paragraph({children:[new TextRun({text:'RENCANA STRATEGIS BISNIS',bold:true,size:36,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:200}}));
    ch.push(new Paragraph({children:[new TextRun({text:'BADAN LAYANAN UMUM',bold:true,size:32,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:200}}));
    ch.push(new Paragraph({children:[new TextRun({text:'UIN KIAI AGENG MUHAMMAD BESARI PONOROGO',bold:true,size:32,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:400}}));
    ch.push(new Paragraph({children:[new TextRun({text:'TAHUN ANGGARAN 2025 s.d. 2029',bold:true,size:28,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:1600}}));
    ch.push(new Paragraph({children:[new TextRun({text:'Disusun berdasarkan PMK Nomor 76 Tahun 2025',size:24,font:'Times New Roman',italics:true})],alignment:AlignmentType.CENTER,spacing:{after:200}}));
    ch.push(new Paragraph({children:[new TextRun({text:'(Perubahan Kedua atas PMK Nomor 129/PMK.05/2020)',size:22,font:'Times New Roman',italics:true})],alignment:AlignmentType.CENTER,spacing:{after:2000}}));
    ch.push(new Paragraph({children:[new TextRun({text:'KEMENTERIAN AGAMA REPUBLIK INDONESIA',bold:true,size:24,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:100}}));
    ch.push(new Paragraph({children:[new TextRun({text:new Date().getFullYear().toString(),size:24,font:'Times New Roman'})],alignment:AlignmentType.CENTER}));
    ch.push(new Paragraph({children:[new PageBreak()]}));

    ch.push(new Paragraph({children:[new TextRun({text:'DAFTAR ISI',bold:true,size:28,font:'Times New Roman'})],alignment:AlignmentType.CENTER,spacing:{after:400}}));
    const toc=['Ringkasan Eksekutif','BAB I \u2014 Pendahuluan','    A. Resume Rencana Strategis K/L','    B. Visi dan Misi BLU','    C. Target RSB',
     'BAB II \u2014 Analisis dan Strategi','    A. Evaluasi Kinerja BLU','    B. Analisis SWOT/BSC/Fishbone','    B2. Analisis PESTLE','    C. Inisiatif Strategis',
     'BAB III \u2014 Rencana Strategis Bisnis 5 Tahun','    A. Program Kementerian/Lembaga','    B. Strategi Bisnis BLU','    C. Kegiatan dan Indikator',
     'BAB IV \u2014 Penutup','Lampiran I \u2014 Evaluasi Kinerja Tahun Berjalan','Lampiran II \u2014 Program dan Kegiatan 5 Tahun',
     'Lampiran III \u2014 Proyeksi 5 Tahun','Lampiran IV \u2014 Matriks Keterkaitan'];
    toc.forEach(item=>{const isSub=item.startsWith('    ');
      ch.push(new Paragraph({children:[new TextRun({text:item.trim(),size:24,font:'Times New Roman',bold:!isSub})],indent:isSub?{left:720}:undefined,spacing:{after:80}}));
    });
    ch.push(new Paragraph({children:[new PageBreak()]}));

    SECTIONS.forEach((sec,si)=>{
      ch.push(new Paragraph({children:[new TextRun({text:`${sec.num} \u2014 ${sec.title}`.toUpperCase(),bold:true,size:28,font:'Times New Roman'})],heading:HeadingLevel.HEADING_1,spacing:{before:400,after:200}}));
      if(sec.limit)ch.push(new Paragraph({children:[new TextRun({text:`(${sec.limit})`,size:20,font:'Times New Roman',italics:true,color:'666666'})],spacing:{after:200}}));
      sec.components.forEach(comp=>{
        const ct=comp.letter?`${comp.letter}. ${comp.title}`:comp.title;
        ch.push(new Paragraph({children:[new TextRun({text:ct,bold:true,size:24,font:'Times New Roman'})],heading:HeadingLevel.HEADING_2,spacing:{before:300,after:150}}));
        if(comp.type.includes('rte')||comp.type==='swot+rte'){const rte=document.getElementById(`rte-${comp.id}`);if(rte)ch.push(...htmlToParas(rte.innerHTML));}
        if(comp.type==='swot+rte'){
          const labels={str:'STRENGTHS (Kekuatan)',wk:'WEAKNESSES (Kelemahan)',opp:'OPPORTUNITIES (Peluang)',thr:'THREATS (Ancaman)'};
          ['str','wk','opp','thr'].forEach(qk=>{
            const qb=document.querySelector(`[data-comp="${comp.id}"] .swot-quad-body[data-quad="${qk}"]`);if(!qb)return;
            ch.push(new Paragraph({children:[new TextRun({text:labels[qk],bold:true,size:22,font:'Times New Roman'})],spacing:{before:200,after:100}}));
            qb.querySelectorAll('.swot-item-text').forEach((it,i)=>{const t=it.textContent.trim();
              if(t)ch.push(new Paragraph({children:[new TextRun({text:`${i+1}. ${t}`,size:22,font:'Times New Roman'})],indent:{left:360},spacing:{after:60}}));
            });
          });
        }
        if(comp.type.includes('table')||comp.table){
          const te=document.querySelector(`#comp-${comp.id} table.editable`);
          if(te){const dt=tblToDocx(te);if(dt){ch.push(new Paragraph({spacing:{before:100}}));ch.push(dt);ch.push(new Paragraph({spacing:{after:200}}));}}
        }
      });
      if(si<SECTIONS.length-1)ch.push(new Paragraph({children:[new PageBreak()]}));
    });

    const doc=new Document({
      creator:'RSB Generator \u2014 BLU UIN Ponorogo',
      title:'Rencana Strategis Bisnis BLU UIN Ponorogo 2025-2029',
      description:'Dokumen RSB sesuai PMK 76 Tahun 2025',
      styles:{default:{document:{run:{font:'Times New Roman',size:24},paragraph:{spacing:{line:360}}}}},
      sections:[{properties:{page:{margin:{top:1440,right:1080,bottom:1440,left:1440},size:{width:12240,height:15840}}},children:ch}]
    });
    const blob=await Packer.toBlob(doc);
    saveAs(blob,`RSB_BLU_UIN_Ponorogo_2025-2029_${new Date().toISOString().slice(0,10)}.docx`);
    showToast('\u2705 DOCX berhasil di-export!');
  }catch(err){console.error('DOCX export error:',err);showToast('\u274c Gagal export: '+err.message);}
}

</script>
</body>
</html>
