const API = '/api/data';

async function runRestore() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  btn.disabled = true;
  log.innerHTML = '';
  let ok = 0, fail = 0;

  const units = Object.entries(BACKUP);
  status.textContent = `Restoring 0/${units.length}...`;

  for (const [uid, record] of units) {
    if (!record) {
      log.innerHTML += `<div class="unit skip">⏭ ${uid}: null/empty, skip</div>`;
      continue;
    }
    const payload = {
      unitId: uid,
      tables: record.tables || {},
      rawData: record.rawData || {},
      savedBy: record.savedBy || 'restore-script',
      schemaVersion: '2026-06-08-v4'
    };
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.ok) {
        ok++;
        log.innerHTML += `<div class="unit ok">✅ ${uid} → saved (by: ${record.savedBy || '?'})</div>`;
      } else {
        fail++;
        log.innerHTML += `<div class="unit err">❌ ${uid}: ${json.error}</div>`;
      }
    } catch(e) {
      fail++;
      log.innerHTML += `<div class="unit err">❌ ${uid}: ${e.message}</div>`;
    }
    status.textContent = `Restoring ${ok+fail}/${units.length}...`;
    log.scrollTop = log.scrollHeight;
  }

  status.textContent = `✅ Selesai: ${ok} berhasil, ${fail} gagal`;
  btn.disabled = false;
  btn.textContent = '🔄 Ulangi';
  if (ok > 0 && fail === 0) {
    setTimeout(() => {
      if (confirm('Semua berhasil! Buka halaman data_collection?')) {
        window.location.href = '/internal/data_collection';
      }
    }, 500);
  }
}
